name: Product website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "script/build_site.py"
      - "docs/screenshots/**"
      - "TableViewer/Services/ConnectionVault.swift"
      - ".github/workflows/pages.yml"
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - name: Read the latest stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/${{ github.repository }}/releases/latest > "$RUNNER_TEMP/release.json"
      - name: Build the product website
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if jq -e '.assets[] | select(.name == "appcast.xml")' "$RUNNER_TEMP/release.json" > /dev/null; then
            TAG=$(jq -r .tag_name "$RUNNER_TEMP/release.json")
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern appcast.xml --dir "$RUNNER_TEMP"
            python3 script/build_site.py --release-json "$RUNNER_TEMP/release.json" --appcast "$RUNNER_TEMP/appcast.xml"
          else
            python3 script/build_site.py --release-json "$RUNNER_TEMP/release.json"
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
